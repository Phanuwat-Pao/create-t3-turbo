packages:
  - apps/*
  - packages/*
  - tooling/*

allowBuilds:
  "@tailwindcss/oxide": true
  bufferutil: true
  esbuild: true
  lefthook: true
  msgpackr-extract: true
  sharp: true
  vue-demi: true

catalog:
  "@better-auth/expo": ^1.7.2
  "@orpc/client": ^1.15.0
  "@orpc/server": ^1.15.0
  "@orpc/tanstack-query": ^1.15.0
  "@tailwindcss/postcss": ^4.3.3
  "@tailwindcss/vite": ^4.3.3
  "@tanstack/react-form": ^1.33.5
  "@tanstack/react-query": ^5.102.8
  "@types/node": ^26.4.1
  "@typescript/native-preview": 7.0.0-dev.20260707.2
  "@vitejs/plugin-react": ^6.1.1
  better-auth: ^1.7.2
  tailwindcss: ^4.3.3
  vite: ^8.2.2
  zod: ^4.5.4

catalogs:
  react19:
    "@types/react": ^19.2.18
    "@types/react-dom": ^19.2.5
    react: ^19.2.8
    react-dom: ^19.2.8

linkWorkspacePackages: true

minimumReleaseAgeExclude:
  - "@aws-sdk/client-s3@3.1049.0 || 3.1109.0 || 3.1125.0"
  - "@aws-sdk/core@3.974.12"
  - "@aws-sdk/credential-provider-env@3.972.38"
  - "@aws-sdk/credential-provider-http@3.972.40"
  - "@aws-sdk/credential-provider-ini@3.972.42"
  - "@aws-sdk/credential-provider-login@3.972.42"
  - "@aws-sdk/credential-provider-node@3.972.43"
  - "@aws-sdk/credential-provider-process@3.972.38"
  - "@aws-sdk/credential-provider-sso@3.972.42"
  - "@aws-sdk/credential-provider-web-identity@3.972.42"
  - "@aws-sdk/middleware-bucket-endpoint@3.972.14"
  - "@aws-sdk/middleware-flexible-checksums@3.974.20"
  - "@aws-sdk/middleware-sdk-s3@3.972.41"
  - "@aws-sdk/nested-clients@3.997.10"
  - "@aws-sdk/s3-request-presigner@3.1049.0 || 3.1109.0 || 3.1125.0"
  - "@aws-sdk/token-providers@3.1049.0"
  - "@tanstack/query-core@5.100.11"
  - "@tanstack/query-devtools@5.100.11"
  - "@tanstack/react-query-devtools@5.100.11"
  - "@tanstack/react-query@5.100.11"
  - "@types/node@25.9.0"
  - date-fns@4.2.1
  - framer-motion@12.39.0 || 13.2.0
  - lucide-react@1.40.0
  - motion-dom@12.39.0 || 13.2.0
  - motion-utils@12.39.0
  - pg-cloudflare@1.4.0
  - pg-connection-string@2.13.0
  - pg-pool@3.14.0
  - pg-protocol@1.14.0
  - pg@8.21.0
  - react-native-safe-area-context@5.8.0
  - react-native-screens@4.25.1
  - react-email@6.1.5
  - ultracite@7.10.3
  - "@nanostores/react@2.0.1"
  - lucide-react-native@1.40.0
  - nanostores@1.5.3

# image-size DoS advisories (dev-only, via metro): patched release 2.0.3 is not
# published as of 2026-08-13 — drop these once it ships and can be overridden.
auditConfig:
  ignoreGhsas:
    - GHSA-w3rx-r6r6-pgpr
    - GHSA-5p2g-fcmc-qvqq
    # decode-uri-component ReDoS (moderate) via query-string@7, which
    # expo-router 57 pins. The only patched release (0.5.0) is ESM-only and
    # query-string@7 is CJS, so an override breaks it at runtime. Drop once
    # expo-router moves off query-string@7.
    - GHSA-vcc3-ghjq-m6fr

overrides:
  "@hono/node-server": ">=1.19.13"
  "@types/minimatch": 5.1.2
  # Patch within 0.8 (like upstream better-auth): samlify (SSO/SAML) breaks on
  # the 0.9 line, which removed the errorHandler DOMParser option.
  "@xmldom/xmldom@<0.8.15": ">=0.8.15 <0.9"
  "@xmldom/xmldom@>=0.9.0 <0.9.12": ">=0.9.12 <0.10"
  # Patch within 7.x: Babel 8 is a breaking major that metro/next can't load yet.
  "@babel/core@<7.29.1": ">=7.29.1 <8"
  # @vercel/otel pulls the OTel SDK family as auto-installed peers; keep the
  # family in lockstep since each sdk-* pins @opentelemetry/core exactly.
  "@opentelemetry/core": ">=2.11.0"
  "@opentelemetry/resources": ">=2.11.0"
  "@opentelemetry/sdk-logs": ">=0.222.0"
  "@opentelemetry/sdk-metrics": ">=2.11.0"
  "@opentelemetry/sdk-trace-base": ">=2.11.0"
  brace-expansion: ">=1.1.13 <2 || >=5.0.9"
  browserslist: ">=4.28.7"
  defu: ">=6.1.5"
  effect: ">=3.20.0"
  # Patch within 0.28: drizzle-kit still pins 0.25, which is not affected.
  "esbuild@>=0.27.3 <0.28.1": ">=0.28.1"
  fast-uri: ">=4.1.3"
  flatted: ">=3.4.2"
  hono: ">=4.12.18"
  ip-address: ">=10.1.1"
  # Patch within 4.x: v5 is a breaking rewrite its v4 consumers can't load.
  "js-yaml@>=4.0.0 <4.3.1": ">=4.3.1 <5"
  lightningcss: 1.33.0
  lodash: ">=4.18.0"
  # Patch within each consumer's major: nanoid 4+ is ESM-only.
  "nanoid@<3.3.17": ">=3.3.17 <4"
  "nanoid@>=4.0.0 <5.1.16": ">=5.1.16 <6"
  node-forge: ">=1.4.0"
  path-to-regexp: ">=8.4.0"
  picomatch: ">=2.3.2"
  postcss: ">=8.5.23"
  qs: ">=6.15.2"
  shell-quote: ">=1.8.5"
  socket.io-parser: ">=4.2.7"
  unhead: ">=2.1.13"
  uuid: ">=11.1.1"
  vite: 8.2.2
  ws: ">=8.21.0"
