packages:
  - apps/*
  - packages/*
  - tooling/*

allowBuilds:
  "@tailwindcss/oxide": true
  "@tsc-rs/typescript": true
  bufferutil: true
  esbuild: true
  lefthook: true
  msgpackr-extract: true
  sharp: true
  vue-demi: true

catalog:
  "@better-auth/expo": ^1.7.12
  "@better-auth/oauth-provider": ^1.7.12
  "@better-auth/passkey": ^1.7.12
  "@better-auth/sso": ^1.7.12
  "@orpc/client": ^1.15.4
  "@orpc/server": ^1.15.4
  "@orpc/tanstack-query": ^1.15.4
  "@tailwindcss/postcss": ^4.3.3
  "@tanstack/react-form": ^1.33.5
  "@tanstack/react-query": ^5.104.1
  "@types/node": ^26.6.4
  better-auth: ^1.7.12
  i18next: ^26.4.4
  react-i18next: ^17.0.16
  tailwindcss: ^4.3.3
  typescript: npm:@tsc-rs/typescript@0.8.0
  vitest: ^5.0.5
  zod: ^4.6.7

catalogs:
  react19:
    "@types/react": ^19.3.0
    "@types/react-dom": ^19.3.0
    react: ^19.3.0
    react-dom: ^19.3.0

linkWorkspacePackages: true

# typescript is @tsc-rs/typescript, whose npm version (0.8.x) is outside every
# typescript peer range.
peerDependencyRules:
  allowAny:
    - typescript

minimumReleaseAgeExclude:
  - "@tsc-rs/*"
  - "@aws-sdk/client-s3@3.1049.0 || 3.1109.0 || 3.1125.0"
  - "@aws-sdk/core@3.974.12"
  - "@aws-sdk/credential-provider-env@3.972.38"
  - "@aws-sdk/credential-provider-http@3.972.40"
  - "@aws-sdk/credential-provider-ini@3.972.42"
  - "@aws-sdk/credential-provider-login@3.972.42"
  - "@aws-sdk/credential-provider-node@3.972.43"
  - "@aws-sdk/credential-provider-process@3.972.38"
  - "@aws-sdk/credential-provider-sso@3.972.42"
  - "@aws-sdk/credential-provider-web-identity@3.972.42"
  - "@aws-sdk/middleware-bucket-endpoint@3.972.14"
  - "@aws-sdk/middleware-flexible-checksums@3.974.20"
  - "@aws-sdk/middleware-sdk-s3@3.972.41"
  - "@aws-sdk/nested-clients@3.997.10"
  - "@aws-sdk/s3-request-presigner@3.1049.0 || 3.1109.0 || 3.1125.0"
  - "@aws-sdk/token-providers@3.1049.0"
  - "@tanstack/query-core@5.100.11"
  - "@tanstack/query-devtools@5.100.11"
  - "@tanstack/react-query-devtools@5.100.11"
  - "@tanstack/react-query@5.100.11"
  - "@types/node@25.9.0"
  - date-fns@4.2.1
  - framer-motion@12.39.0 || 13.2.0
  - lucide-react@1.40.0
  - motion-dom@12.39.0 || 13.2.0
  - motion-utils@12.39.0
  - pg-cloudflare@1.4.0
  - pg-connection-string@2.13.0
  - pg-pool@3.14.0
  - pg-protocol@1.14.0
  - pg@8.21.0
  - react-native-safe-area-context@5.8.0
  - react-native-screens@4.25.1
  - react-email@6.1.5
  - ultracite@7.10.3 || 7.12.3
  - "@nanostores/react@2.0.1"
  - lucide-react-native@1.40.0
  - nanostores@1.5.3
  - "@types/react-dom@19.2.6"
  - lefthook-darwin-arm64@2.1.17
  - lefthook-darwin-x64@2.1.17
  - lefthook-freebsd-arm64@2.1.17
  - lefthook-freebsd-x64@2.1.17
  - lefthook-linux-arm64@2.1.17
  - lefthook-linux-x64@2.1.17
  - lefthook-openbsd-arm64@2.1.17
  - lefthook-openbsd-x64@2.1.17
  - lefthook-windows-arm64@2.1.17
  - lefthook-windows-x64@2.1.17
  - lefthook@2.1.17
  - uniwind@1.12.2
  - postcss@8.5.29
  - "@expo/cli@58.1.15"
  - "@expo/config@58.0.8"
  - "@expo/local-build-cache-provider@58.0.8"
  - "@expo/metro-config@58.0.17"
  - "@expo/prebuild-config@58.0.16"
  - "@expo/router-server@58.0.17"
  - babel-preset-expo@58.0.20
  - expo-dev-client@58.0.15
  - expo-dev-launcher@58.0.15
  - expo-file-system@58.0.11
  - expo-font@58.0.10
  - expo-glass-effect@58.0.5
  - expo-modules-autolinking@58.0.15
  - expo-modules-cli@0.3.2
  - expo-modules-core@58.0.26
  - expo-modules-jsi@58.0.19
  - expo-router@58.0.26
  - expo-server@58.0.6
  - expo-sqlite@58.0.14
  - expo@58.0.19

auditConfig:
  ignoreGhsas:
    # node-forge (high): no patched release exists, 1.4.0 is the newest. It
    # arrives only through @expo/cli and its @expo/code-signing-certificates;
    # the Next.js server never loads it. Drop once a fixed version ships.
    - GHSA-86w9-cpqp-85rv
    # zod memory exhaustion on oversized constrained collections (high),
    # fixed only in 4.6.6. zod 3.25.76 is @expo/cli's, which pins ^3.25.76;
    # it validates local devtools plugin manifests in the dev server, never
    # network input. Our own zod is the catalog's 4.x, floored past the fix.
    # Forcing 4.x onto the CLI would cross a major. Drop once @expo/cli moves
    # to zod 4.
    - GHSA-mrhx-c7xc-m3w5

overrides:
  # Patch within 4.0: @scalar/agent-chat's ai-sdk deps pin 4.0.5 exactly.
  "@ai-sdk/provider-utils@>=4.0.0-beta.10 <4.0.33": ">=4.0.33 <5"
  "@hono/node-server": ">=1.19.13"
  # Patch within 0.8 (like upstream better-auth): samlify (SSO/SAML) breaks on
  # the 0.9 line, which removed the errorHandler DOMParser option.
  "@xmldom/xmldom@<0.8.15": ">=0.8.15 <0.9"
  "@xmldom/xmldom@>=0.9.0 <0.9.12": ">=0.9.12 <0.10"
  # Patch within 7.x: Babel 8 is a breaking major that metro/next can't load yet.
  "@babel/core@<7.29.1": ">=7.29.1 <8"
  # @vercel/otel pulls the OTel SDK family as auto-installed peers; keep the
  # family in lockstep since each sdk-* pins @opentelemetry/core exactly.
  "@opentelemetry/core": ">=2.11.0"
  "@opentelemetry/resources": ">=2.11.0"
  "@opentelemetry/sdk-logs": ">=0.222.0"
  "@opentelemetry/sdk-metrics": ">=2.11.0"
  "@opentelemetry/sdk-trace-base": ">=2.11.0"
  brace-expansion: ">=1.1.13 <2 || >=5.0.9"
  browserslist: ">=4.28.7"
  defu: ">=6.1.5"
  effect: ">=3.20.0"
  # Patch within 0.28, the only esbuild line left since drizzle-kit 1.0.0-rc.5
  # dropped its 0.25 pin.
  "esbuild@>=0.27.3 <0.28.1": ">=0.28.1"
  fast-uri: ">=4.2.3"
  flatted: ">=3.4.2"
  hono: ">=4.12.18"
  ip-address: ">=10.1.1"
  # Patch within 4.x: v5 is a breaking rewrite its v4 consumers can't load.
  "js-yaml@>=4.0.0 <4.3.2": ">=4.3.2 <5"
  # Floor, not pin: @tailwindcss/node and uniwind pin older exact versions,
  # so a single override keeps one native binary in the tree.
  lightningcss: ">=1.33.0"
  lodash: ">=4.18.0"
  # Patch within each consumer's major: nanoid 4+ is ESM-only.
  "nanoid@<3.3.17": ">=3.3.17 <4"
  "nanoid@>=4.0.0 <5.1.16": ">=5.1.16 <6"
  node-forge: ">=1.4.0"
  path-to-regexp: ">=8.4.0"
  picomatch: ">=2.3.2"
  postcss: ">=8.5.29"
  qs: ">=6.15.2"
  # Expo SDK 58 pins the React Native family (see expo/bundledNativeModules.json).
  # Auto-installed peers in the non-Expo workspaces (drizzle-orm -> expo-sqlite,
  # better-auth -> expo-router) would otherwise drift to the newest release and
  # put a second copy of each in the tree.
  react-native: "~0.88.0"
  react-native-gesture-handler: "~3.3.0"
  react-native-reanimated: "~4.7.1"
  react-native-safe-area-context: "~5.10.1"
  react-native-screens: "~4.30.0"
  react-native-worklets: "~0.13.0"
  shell-quote: ">=1.8.5"
  # next 16.4 still pins 0.35.4; 0.35.5 patches the librsvg advisory.
  sharp: ">=0.35.5"
  socket.io-parser: ">=4.2.7"
  # Patch within each consumer's major: @scalar/agent-chat's ai-sdk and
  # api-client deps pull both the 6.x and 7.x lines.
  "undici@>=6.0.0 <6.29.1": ">=6.29.1 <7"
  "undici@>=7.0.0 <7.30.1": ">=7.30.1 <8"
  unhead: ">=2.1.13"
  uuid: ">=11.1.1"
  vite: ">=8.3.5"
  ws: ">=8.21.0"
